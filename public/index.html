<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">Blue Jay Bot</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/panel.css">
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="app.title">Blue Jay Bot</h1>
    <span id="connection" class="status"></span>
    <label class="language">
      <span data-i18n="app.language">Idioma</span>
      <select id="language">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </label>
  </header>

  <main>
    <section class="card now-playing">
      <h2 data-i18n="now.title">Sonando ahora</h2>
      <div class="player-frame">
        <div id="player"></div>
      </div>
      <audio id="local-audio" class="local-audio" controls hidden></audio>
      <div class="now-row">
        <p id="now-title" class="now-title"></p>
        <button id="now-favorite" class="icon" type="button"></button>
        <button id="now-ban" class="icon danger" type="button"></button>
        <button id="next" type="button"><span data-i18n="now.next">Siguiente</span></button>
      </div>
      <label class="volume">
        <span data-i18n="volume.label">Volumen</span>
        <input id="volume" type="range" min="0" max="100" step="1" value="50">
        <output id="volume-value" for="volume">50%</output>
      </label>
    </section>

    <section class="card">
      <h2 data-i18n="add.title">Añadir canción</h2>
      <form id="add-form" class="add-form">
        <input id="add-input" type="text" required autocomplete="off" data-i18n-placeholder="add.placeholder">
        <button type="submit" data-i18n="add.submit">Añadir</button>
      </form>
    </section>

    <section class="card tabs">
      <div class="tablist" role="tablist">
        <button id="tab-queue" class="tab" type="button" role="tab" data-tab="queue" aria-selected="true" aria-controls="panel-queue">
          <span data-i18n="queue.title">Cola</span> <span id="count-queue" class="badge"></span>
        </button>
        <button id="tab-baselist" class="tab" type="button" role="tab" data-tab="baselist" aria-selected="false" aria-controls="panel-baselist" tabindex="-1">
          <span data-i18n="baselist.title">Lista base</span> <span id="count-baselist" class="badge"></span>
        </button>
        <button id="tab-library" class="tab" type="button" role="tab" data-tab="library" aria-selected="false" aria-controls="panel-library" tabindex="-1">
          <span data-i18n="library.title">Biblioteca local</span> <span id="count-library" class="badge"></span>
        </button>
        <button id="tab-banned" class="tab" type="button" role="tab" data-tab="banned" aria-selected="false" aria-controls="panel-banned" tabindex="-1">
          <span data-i18n="banned.title">Lista negra</span> <span id="count-banned" class="badge"></span>
        </button>
      </div>

      <div id="panel-queue" class="tabpanel" role="tabpanel" aria-labelledby="tab-queue">
        <ol id="queue" class="queue"></ol>
        <p id="queue-empty" class="empty" data-i18n="queue.empty">La cola está vacía.</p>
      </div>

      <div id="panel-baselist" class="tabpanel" role="tabpanel" aria-labelledby="tab-baselist" hidden>
        <form id="baselist-form" class="add-form">
          <input id="baselist-input" type="text" required autocomplete="off" data-i18n-placeholder="baselist.placeholder">
          <button type="submit" data-i18n="baselist.add">Añadir</button>
        </form>
        <div class="controls">
          <button id="baselist-start" type="button"><span data-i18n="baselist.start">START</span></button>
          <button id="baselist-shuffle" type="button"><span data-i18n="baselist.shuffle">SHUFFLE</span></button>
          <button id="baselist-stop" class="secondary" type="button"><span data-i18n="baselist.stop">Parar</span></button>
          <button id="baselist-clear" class="secondary" type="button"><span data-i18n="baselist.clear">Vaciar</span></button>
        </div>
        <p id="baselist-status" class="empty"></p>
        <p id="baselist-count" class="empty"></p>
        <ul id="baselist" class="track-list"></ul>
        <p id="baselist-empty" class="empty" data-i18n="baselist.empty">La lista base está vacía.</p>
      </div>

      <div id="panel-library" class="tabpanel" role="tabpanel" aria-labelledby="tab-library" hidden>
        <form id="library-form" class="add-form">
          <input id="library-folder" type="text" required autocomplete="off" data-i18n-placeholder="library.folderPlaceholder">
          <button type="submit" data-i18n="library.folderSave">Guardar carpeta</button>
        </form>
        <div class="controls">
          <button id="library-rescan" class="secondary" type="button"><span data-i18n="library.rescan">Reescanear</span></button>
          <label class="check">
            <input id="library-include" type="checkbox">
            <span data-i18n="library.include">Incluir la biblioteca en la lista base</span>
          </label>
        </div>
        <p id="library-status" class="empty"></p>
        <input id="library-search" type="search" autocomplete="off" data-i18n-placeholder="library.searchPlaceholder">
        <ul id="library-results" class="track-list"></ul>
        <p id="library-empty" class="empty" data-i18n="library.empty">No hay pistas que mostrar.</p>
        <p id="library-showing" class="empty"></p>
      </div>

      <div id="panel-banned" class="tabpanel" role="tabpanel" aria-labelledby="tab-banned" hidden>
        <ul id="banned" class="track-list"></ul>
        <p id="banned-empty" class="empty" data-i18n="banned.empty">No hay canciones vetadas.</p>
      </div>
    </section>
  </main>

  <div id="notices" class="notices" role="status" aria-live="polite"></div>

  <script src="/vendor/i18next/i18next.min.js"></script>
  <script src="/vendor/sortablejs/Sortable.min.js"></script>
  <script type="module" src="/js/panel.js"></script>
</body>
</html>
